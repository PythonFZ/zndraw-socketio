[project]
name = "zndraw-socketio"
dynamic = ["version"]
description = "Typed wrapper for python-socketio with Pydantic validation and dependency injection."
readme = "README.md"
authors = [
    { name = "Fabian Zills", email = "fabian.zills@web.de" }
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["socketio", "pydantic", "wrapper", "typed", "zndraw"]
dependencies = [
    "pydantic>=2.10.6",
    "python-socketio>=5.12.1",
    "typing_extensions>=4.13.0",
]

[project.urls]
homepage = "https://github.com/pythonFZ/zndraw-socketio"
issues = "https://github.com/pythonFZ/zndraw-socketio/issues"

[project.optional-dependencies]
client = [
    "python-socketio[client]>=5.12.1",
]
asyncio-client = [
    "python-socketio[asyncio-client]>=5.12.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zndraw_socketio/_version.py"

[dependency-groups]
dev = [
    "aiohttp>=3.11.13",
    "fastapi[standard]>=0.115.11",
    "pyright>=1.1.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "python-socketio[client]>=5.12.1",
    "ruff>=0.11.0",
    "typing_extensions>=4.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
